<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="s3-light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8d5b0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a08040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060604" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s3-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060604"/>
      <stop offset="100%" stop-color="#0e0c08"/>
    </linearGradient>
    <radialGradient id="s3-glow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#e8d5b0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8d5b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#s3-sky)"/>
  <rect x="0" y="0" width="800" height="1000" fill="url(#s3-glow)"/>
  <g fill="#181410" opacity="0.95">
    <rect x="0" y="200" width="180" height="800" rx="4"/>
    <rect x="160" y="280" width="160" height="720"/>
    <rect x="300" y="140" width="140" height="860" rx="2"/>
    <rect x="420" y="220" width="120" height="780"/>
    <rect x="520" y="160" width="160" height="840" rx="3"/>
    <rect x="660" y="260" width="140" height="740"/>
  </g>
  <polygon points="320,140 360,0 400,140" fill="#e8d5b0" opacity="0.8"/>
  <polygon points="340,200 360,80 380,200" fill="url(#s3-light)"/>
  <g stroke="#e8d5b0" stroke-width="1" opacity="0.1">
    <line x1="360" y1="0" x2="0" y2="350"/>
    <line x1="360" y1="0" x2="800" y2="350"/>
    <line x1="360" y1="0" x2="100" y2="1000"/>
    <line x1="360" y1="0" x2="700" y2="1000"/>
  </g>
  <rect x="0" y="900" width="800" height="100" fill="#060604"/>
  <g fill="#0e0c08">
    <ellipse cx="400" cy="960" rx="380" ry="40"/>
  </g>
</svg>
